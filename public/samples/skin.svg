<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Skin base color -->
  <rect width="320" height="320" fill="#fbcfe8" /> <!-- pinkish-flesh tone base -->
  <rect width="320" height="320" fill="url(#skin-base-grad)" />
  
  <!-- Skin pores / texture -->
  <circle cx="40" cy="50" r="1" fill="#e11d48" opacity="0.1" />
  <circle cx="120" cy="80" r="1.5" fill="#e11d48" opacity="0.1" />
  <circle cx="280" cy="40" r="1" fill="#e11d48" opacity="0.1" />
  <circle cx="70" cy="220" r="2" fill="#e11d48" opacity="0.12" />
  <circle cx="250" cy="260" r="1" fill="#e11d48" opacity="0.1" />
  <circle cx="180" cy="290" r="1.5" fill="#e11d48" opacity="0.1" />
  
  <!-- Main Rash Redness Area -->
  <circle cx="160" cy="160" r="75" fill="url(#rash-diffuse)" />
  
  <!-- Individual rash bumps / papules -->
  <circle cx="140" cy="140" r="6" fill="#be123c" opacity="0.8" />
  <circle cx="140" cy="140" r="3" fill="#fda4af" opacity="0.6" />
  
  <circle cx="175" cy="130" r="8" fill="#be123c" opacity="0.75" />
  <circle cx="175" cy="130" r="4" fill="#fda4af" opacity="0.5" />
  
  <circle cx="150" cy="180" r="7" fill="#be123c" opacity="0.8" />
  <circle cx="150" cy="180" r="3.5" fill="#fda4af" opacity="0.6" />
  
  <circle cx="185" cy="170" r="9" fill="#be123c" opacity="0.75" />
  <circle cx="185" cy="170" r="4.5" fill="#fda4af" opacity="0.5" />
  
  <circle cx="120" cy="165" r="5" fill="#be123c" opacity="0.7" />
  
  <circle cx="190" cy="195" r="6" fill="#be123c" opacity="0.75" />
  
  <circle cx="160" cy="150" r="7" fill="#be123c" opacity="0.8" />
  <circle cx="160" cy="150" r="3" fill="#fda4af" opacity="0.6" />
  
  <circle cx="210" cy="150" r="5" fill="#be123c" opacity="0.6" />
  <circle cx="130" cy="120" r="6" fill="#be123c" opacity="0.6" />
  
  <defs>
    <linearGradient id="skin-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdb584" />
    </linearGradient>
    
    <radialGradient id="rash-diffuse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#fca5a5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
